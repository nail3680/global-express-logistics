 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Express Logistics</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #082b55;
    color: white;
    text-align: center;
    padding: 35px 15px;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin-bottom: 0;
}

.container {
    max-width: 600px;
    margin: 40px auto;
    padding: 25px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

h2 {
    text-align: center;
    color: #082b55;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 16px;
    margin: 15px 0;
}

button {
    width: 100%;
    padding: 15px;
    background: #f59e0b;
    border: none;
    border-radius: 6px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #d97706;
}

#result {
    margin-top: 25px;
    padding: 15px;
    border-radius: 8px;
    background: #f8fafc;
    line-height: 1.8;
}

footer {
    text-align: center;
    padding: 25px;
    background: #082b55;
    color: white;
    margin-top: 50px;
}
</style>
</head>

<body>

<header>
    <h1>GLOBAL EXPRESS LOGISTICS</h1>
    <p>Fast, Safe and Reliable Shipping</p>
</header>

<div class="container">
    <h2>Track Your Shipment</h2>

    <p>Enter your tracking number below to check your shipment status.</p>

    <input
        type="text"
        id="trackingNumber"
        placeholder="Enter tracking number"
    >

    <button onclick="trackPackage()">TRACK SHIPMENT</button>

    <div id="result">
        Your shipment information will appear here.
    </div>
</div>

<footer>
    <p>Global Express Logistics &copy; 2026</p>
    <p>Reliable Shipping Across the United States</p>
</footer>

<script>
function trackPackage() {

    let code = document.getElementById("trackingNumber")
        .value.trim().toUpperCase();

    let result = document.getElementById("result");

    const shipments = {
        "GLX123456": ["In Transit", "Dallas, Texas"],
        "GLX123457": ["In Transit", "Houston, Texas"],
        "GLX123458": ["Picked Up", "Austin, Texas"],
        "GLX123459": ["In Transit", "New York, New York"],
        "GLX123460": ["Out for Delivery", "Los Angeles, California"],
        "GLX123461": ["In Transit", "Chicago, Illinois"],
        "GLX123462": ["In Transit", "Miami, Florida"],
        "GLX123463": ["Picked Up", "Atlanta, Georgia"],
        "GLX123464": ["In Transit", "Washington, DC"],
        "GLX123465": ["Delivered", "Phoenix, Arizona"]
    };

    if (shipments[code]) {

        result.innerHTML =
            "<h3>Shipment Found!</h3>" +
            "<p><strong>Tracking Number:</strong> " + code + "</p>" +
            "<p><strong>Status:</strong> " + shipments[code][0] + "</p>" +
            "<p><strong>Current Location:</strong> " +
            shipments[code][1] + "</p>";

    } else {

        result.innerHTML =
            "<h3>Shipment Not Found</h3>" +
            "<p>Please check your tracking number and try again.</p>";

    }
}
</script>

</body>
</html>
